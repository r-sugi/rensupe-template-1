# ─────────────────────────────────────────────────────────────
#  ホームページの内容
#  このファイルを書き換えて GitHub の main に保存（コミット）すると、
#  2〜3分でホームページに反映されます。
#
#  書き方のルール
#  - 「項目名: 値」の形です。項目名（: の左側）は変えないでください。
#  - [ ] で囲んだ部分は、自分のお店の内容に書き換えてください。
#  - 文章に : や # を含むときは、全体を ' ' で囲んでください。
#  - 先頭のスペース（字下げ）はそろえたままにしてください。
#  - 複数行の文章は「|」のあとに改行し、字下げして書きます（hero_copy を参考に）。
# ─────────────────────────────────────────────────────────────

# お店の基本情報と、各見出し・説明文
site:
  # ブラウザのタブや検索結果に出るタイトルと説明文
  meta_title: "[最寄り駅]のレンタルスタジオ [店名]｜24時間・1時間500円〜"
  meta_description: "[最寄り駅]徒歩[N]分。大型鏡・Bluetoothスピーカー・無料Wi-Fi完備の少人数向けレンタルスタジオ。24時間営業、会員登録不要、1時間500円から。"

  # ヘッダー・フッターの店名と、ロゴの四角に入れる1文字
  brand_name: "レンタルスタジオ [店名]"
  brand_mark: "R"

  # トップの大見出し（2つ合わせて1行。スマホでは2つの間で改行）と説明文
  hero_title_a: "[最寄り駅]徒歩[N]分・"
  hero_title_b: "24時間営業"
  hero_copy: |
    大型鏡、Bluetoothスピーカー、無料Wi-Fiを完備。
    ひとりでも、仲間とでも、気兼ねなく集中できる少人数向けレンタルスタジオです。
  # トップの写真（content/photos に置いたファイル名）
  hero_image_key: "hero.jpg"

  features_title: "[店名]が選ばれる理由"
  facility_lead: "少人数で使いやすい[広さ]㎡のスタジオ。練習・撮影に必要な設備を無料でご利用いただけます。"
  price_lead: "登録料・月額料なし。表示価格はすべて税込です。"

  # 空き状況（Googleカレンダーの埋め込みURL。README の「カレンダーを表示する」を参照）
  availability_lead: "カレンダーの「予定あり」と表示されている時間帯はご利用いただけません。空いている時間を確認してからご予約ください。"
  availability_note: "※スマートフォンではカレンダーを左右にスクロールできます。カレンダーが表示されない場合は、予約画面からも空き状況を確認できます。"
  calendar_embed_url: "https://calendar.google.com/calendar/embed?src=[CALENDAR_ID]&ctz=Asia%2FTokyo&mode=WEEK&showTitle=0&showTabs=0&showCalendars=0&showTz=0"

  # アクセス（地図は住所から自動で作られます）
  access_lead: "[最寄り駅]から徒歩[N]分"
  address: |
    [都道府県市区町村 番地]
    [建物名・階]
  hours: "24時間・365日"
  station: "[路線名][最寄り駅]から徒歩[N]分"

  # ボタン・リンクの行き先
  reservation_url: "https://[予約ページのURL]"
  law_url: "https://[特定商取引法に基づく表記のURL]"
  floating_cta_label: "空き状況・予約はこちら"

# 「選ばれる理由」（上から順に表示。4つがきれいに並びます）
features:
  - title: "[最寄り駅]徒歩[N]分"
    body: "分かりやすい立地"
  - title: "当日予約OK"
    body: "会員登録なし・1時間から"
  - title: "24時間営業"
    body: "1時間500円から"
  - title: "設備無料"
    body: "大型鏡・Wi-Fi・スピーカー"

# 「スタジオと設備」のタグ
specs:
  - "広さ [広さ]㎡"
  - "大型鏡 [幅]m"
  - "無料Wi-Fi"
  - "24時間"

# 「スタジオと設備」の写真（file は content/photos に置いたファイル名）
photos:
  - file: "facility-01.jpg"
    alt: "大型鏡を備えたスタジオ室内"
    caption: "スタジオ全景・大型ミラー"
  - file: "facility-02.jpg"
    alt: "別角度から見たスタジオ室内"
    caption: "プライベート空間"
  - file: "facility-03.jpg"
    alt: "Bluetoothスピーカー"
    caption: "Bluetoothスピーカー"
  - file: "facility-04.jpg"
    alt: "空気清浄機"
    caption: "空気清浄機"
  - file: "facility-05.jpg"
    alt: "スマートフォン撮影用三脚"
    caption: "スマホ撮影用三脚"
  - file: "facility-06.jpg"
    alt: "椅子"
    caption: "椅子 2脚"
  - file: "facility-07.jpg"
    alt: "掃除用モップ"
    caption: "セルフクリーニング用品"
  - file: "facility-08.jpg"
    alt: "靴置き場とスリッパ"
    caption: "靴置き場・スリッパ"
  - file: "facility-09.jpg"
    alt: "CDプレーヤー"
    caption: "CDプレーヤー"

# 料金（amount は税込の金額。数字だけを書きます）
prices:
  - tag: "平日 9:00–18:00"
    title: "平日・日中"
    amount: 900
    note: "平日18:00〜24:00は1時間1,100円"
  - tag: "深夜・早朝 0:00–9:00"
    title: "深夜・早朝"
    amount: 500
    note: "ひとり練習や朝活におすすめの最安プラン"
  - tag: "土日 9:00–24:00"
    title: "土曜日・日曜日"
    amount: 1300
    note: "1〜3名程度の練習にちょうどいい広さ"

# ご利用方法（上から順に番号が付きます）
steps:
  - title: "ウェブから予約"
    body: "空き状況を確認し、希望日時と利用時間を選びます。"
  - title: "オンラインで支払い"
    body: "クレジットカード・PayPay・銀行振込から選択できます。"
  - title: "キーボックスで入室"
    body: "予約後の案内を確認し、当日は鍵を取り出して入室します。"
  - title: "清掃して退室"
    body: "利用後はセルフクリーニング。鍵を戻したら完了です。"

# よくある質問（上から順に表示。増やすときは - question: から2行をコピーして足します）
faqs:
  - question: "当日の予約はできますか？"
    answer: "空きがあれば当日・直前でも予約できます。予約画面から空き状況をご確認ください。"
  - question: "ダンス以外にも利用できますか？"
    answer: "ヨガ、トレーニング、ポージング、演劇練習、撮影など、さまざまな用途で利用できます。"
  - question: "何人くらいで使えますか？"
    answer: "[広さ]㎡のスタジオで、ダンスなら1〜3名程度が目安です。2名なら広々と利用できます。"
  - question: "室内シューズは必要ですか？"
    answer: "靴下・スリッパ・室内シューズでご利用ください。床を傷つける靴や黒い跡が付く靴はご遠慮ください。"
  - question: "キャンセル料金はかかりますか？"
    answer: "予約日の6〜2日前は50%、前日・当日は100%のキャンセル料が発生します。"
  - question: "駐車場・駐輪場はありますか？"
    answer: "入口前に無料駐輪スペースがあります。車の場合は近隣のコインパーキングをご利用ください。"
